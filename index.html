<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07090f">
<title>ASPID Poll</title>
<script>
/* ============================================================
   CONFIGURACIÓN (no hace falta tocar nada)
   Si cambias las opciones, cambia también POLL_ID para empezar de cero.
   ============================================================ */
var POLL_ID = 'leem-aspid-2026-k7q3';

var POLL = {
  question: 'What will happen to ASPID?',
  options: [
    '🏆 We win S3',
    '🪨 Ballistic landing',
    '💥 RUD (Rapid Unscheduled Disassembly)',
    '🔌 Electronics failure, no launch'
  ]
};
/* ============================================================ */
</script>
<style>
  :root{
    color-scheme:dark;
    --bg:#07090f; --bg2:#0e1320; --ink:#f2f4f8; --muted:#8a93a8;
    --accent:#ff6a2b; --accent2:#ffb347; --line:#1f2740; --ok:#38d39f; --warn:#ffd23f;
    --c1:#ff6a2b; --c2:#3fa7ff; --c3:#38d39f; --c4:#c77dff; --c5:#ffd23f; --c6:#ff4f7b;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:radial-gradient(ellipse at 50% 120%,#1a1030 0%,var(--bg) 55%) fixed,var(--bg);
    color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;
  }
  body.stand{overflow:hidden}
  [hidden]{display:none!important}
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none}
  .app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;
    padding:max(24px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
  body.stand .app{height:100%}
  header{display:flex;justify-content:center;margin-bottom:2vh}
  #logo{font-weight:900;letter-spacing:.35em;font-size:clamp(18px,2.6vw,28px);color:var(--accent);padding:8px 8px 8px calc(8px + .35em);text-align:center}
  #logo small{display:block;font-size:.45em;letter-spacing:.3em;color:var(--muted);font-weight:600}
  h1{text-align:center;font-size:clamp(28px,5vw,58px);line-height:1.1;font-weight:800;margin:1vh auto 4vh;max-width:18ch;text-wrap:balance}
  .grid{display:grid;gap:clamp(12px,2vw,22px);grid-template-columns:repeat(2,1fr);grid-auto-rows:minmax(130px,1fr)}
  body.stand .grid{flex:1;min-height:0}
  .grid.n1{grid-template-columns:1fr}
  .grid.n3 .opt:last-child,.grid.n5 .opt:last-child{grid-column:1/-1}
  @media (max-width:520px){ body:not(.stand) .grid{grid-template-columns:1fr;grid-auto-rows:minmax(96px,auto)} body:not(.stand) .grid .opt:last-child{grid-column:auto} }
  .opt{
    border:none;border-radius:26px;color:#fff;font:inherit;font-weight:800;
    font-size:clamp(20px,3.6vw,42px);line-height:1.15;padding:18px;cursor:pointer;
    background:linear-gradient(160deg,var(--c) 0%,color-mix(in srgb,var(--c) 55%,#000) 100%);
    box-shadow:0 10px 30px -10px var(--c),inset 0 1px 0 rgba(255,255,255,.25);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3em;
    transition:transform .08s ease,filter .08s ease;text-wrap:balance;
  }
  .opt .emo{font-size:1.5em;line-height:1}
  .opt:active{transform:scale(.96);filter:brightness(1.15)}
  .opt:focus-visible,.btn:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}
  .hint{text-align:center;color:var(--muted);font-size:clamp(14px,1.6vw,18px);margin-top:2.5vh}

  /* Results (online voters + admin) */
  .results{max-width:640px;width:100%;margin:0 auto}
  .bar{margin:14px 0}
  .bar .lbl{display:flex;justify-content:space-between;gap:12px;font-size:18px;margin-bottom:6px}
  .bar .lbl b{font-variant-numeric:tabular-nums;white-space:nowrap}
  .bar.mine .lbl span::after{content:"  ← you";color:var(--accent2);font-weight:700}
  .bar .track{height:16px;background:#0a0e18;border-radius:9px;overflow:hidden}
  .bar .fill{height:100%;border-radius:9px;transition:width .6s ease}
  .meta{color:var(--muted);text-align:center;margin-top:18px;font-size:15px;font-variant-numeric:tabular-nums}

  /* Thank-you overlay (stand) */
  #thanks{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(7,9,15,.94);text-align:center;padding:24px}
  #thanks .rocket{font-size:clamp(80px,14vw,160px);animation:launch 1.9s ease-in forwards}
  #thanks h2{font-size:clamp(34px,6vw,72px);font-weight:900;margin-top:2vh}
  #thanks p{color:var(--muted);font-size:clamp(18px,2.4vw,26px);margin-top:1vh}
  #thanks .pick{color:var(--accent2);font-weight:700}
  @keyframes launch{0%{transform:translateY(0)}35%{transform:translateY(6px) rotate(-1deg)}100%{transform:translateY(-70vh)}}
  @media (prefers-reduced-motion:reduce){#thanks .rocket{animation:none}}

  /* Admin */
  #admin{position:fixed;inset:0;z-index:10;background:var(--bg2);overflow:auto;padding:28px 18px;user-select:text;-webkit-user-select:text}
  #admin .wrap{max-width:720px;margin:0 auto}
  #admin h3{font-size:24px;margin-bottom:6px}
  #admin h4{font-size:14px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:26px 0 8px}
  .total{font-size:42px;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums}
  .status{display:inline-flex;align-items:center;gap:8px;font-size:15px;padding:6px 12px;border-radius:999px;background:#141b2e;margin-top:10px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)}
  .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
  .btn{border:1px solid var(--line);background:#141b2e;color:var(--ink);border-radius:12px;padding:13px 18px;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#111}
  .note{color:var(--muted);font-size:14px;margin-top:8px;line-height:1.5}
  #toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#222c47;color:#fff;padding:12px 20px;border-radius:12px;z-index:20;font-size:16px}
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div class="app">
  <header><div id="logo">ASPID<small>LEEM · ETSIAE</small></div></header>
  <h1 id="question"></h1>

  <section id="voteView">
    <div id="grid" class="grid"></div>
    <div class="hint">Tap an option to vote 🚀</div>
  </section>

  <section id="resultView" class="results" hidden>
    <div id="pubBars"></div>
    <div class="meta" id="pubMeta"></div>
  </section>
</div>

<div id="thanks" hidden>
  <div class="rocket">🚀</div>
  <h2>Vote counted!</h2>
  <p>You voted: <span class="pick" id="pick"></span></p>
  <p>Follow ASPID to see what happens at launch</p>
</div>

<div id="admin" hidden>
  <div class="wrap">
    <h3>Stand panel</h3>
    <div class="note">Opens by tapping the ASPID logo 5 times.</div>
    <div class="status"><span class="dot" id="dot"></span><span id="statusTxt">Checking…</span></div>

    <h4>All votes (stand + online)</h4>
    <div><span class="total" id="total">–</span> votes <span class="note" id="split"></span></div>
    <div id="bars"></div>

    <div class="row">
      <button class="btn" id="refresh">Refresh</button>
      <button class="btn" id="sync">Send pending votes</button>
      <button class="btn" id="copy">Copy summary</button>
      <button class="btn" id="fs">Fullscreen</button>
    </div>
    <div class="note">Test votes count too. To start from zero, change POLL_ID in index.html.</div>

    <div class="row" style="margin-top:30px"><button class="btn primary" id="close">Back to voting</button></div>
  </div>
</div>

<div id="toast" hidden></div>

<script>
(function(){
  var STAND = /[?&#]stand\b/.test(location.search + location.hash);
  var API = 'https://abacus.jasoncameron.dev';
  var CONNECTED = true;
  var COLORS = ['--c1','--c2','--c3','--c4','--c5','--c6'];
  var K_QUEUE = 'aspidPoll.queue.v3', K_VOTED = 'aspidPoll.voted.v3', K_DEV = 'aspidPoll.dev.v3';
  var $ = function(id){ return document.getElementById(id); };

  // ---- storage (never throws) ----
  var mem = {};
  function load(k, d){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return k in mem ? mem[k] : d; } }
  function save(k, v){ mem[k] = v; try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

  var dev = load(K_DEV, null);
  if (!dev){ dev = (STAND ? 'stand-' : 'web-') + Math.random().toString(36).slice(2, 10); save(K_DEV, dev); }
  var queue = load(K_QUEUE, []);
  var summary = null;   // {counts:{1:n,...}, total, stand, online}

  if (STAND) document.body.classList.add('stand');

  // ---- render vote buttons ----
  function split(label){
    var m = label.match(/^(\p{Extended_Pictographic}[️‍\p{Extended_Pictographic}]*)\s*(.*)$/u);
    return m ? {emo:m[1], text:m[2]} : {emo:'', text:label};
  }
  $('question').textContent = POLL.question;
  var g = $('grid');
  g.className = 'grid n' + POLL.options.length;
  POLL.options.forEach(function(o, i){
    var b = document.createElement('button');
    b.className = 'opt';
    b.style.setProperty('--c', 'var(' + COLORS[i % COLORS.length] + ')');
    var s = split(o);
    if (s.emo){ var e = document.createElement('span'); e.className = 'emo'; e.textContent = s.emo; b.appendChild(e); }
    var t = document.createElement('span'); t.textContent = s.text; b.appendChild(t);
    b.addEventListener('click', function(){ vote(i); });
    g.appendChild(b);
  });

  // ---- bars ----
  function drawBars(box, mine){
    box.innerHTML = '';
    var c = POLL.options.map(function(_, i){ return summary && summary.counts[i+1] || 0; });
    var tot = c.reduce(function(a,b){ return a+b; }, 0);
    POLL.options.forEach(function(o, i){
      var pct = tot ? Math.round(c[i]*100/tot) : 0;
      var d = document.createElement('div'); d.className = 'bar' + (i === mine ? ' mine' : '');
      var l = document.createElement('div'); l.className = 'lbl';
      var a = document.createElement('span'); a.textContent = o;
      var n = document.createElement('b'); n.textContent = pct + '%';
      l.appendChild(a); l.appendChild(n);
      var tr = document.createElement('div'); tr.className = 'track';
      var f = document.createElement('div'); f.className = 'fill';
      f.style.width = pct + '%'; f.style.background = 'var(' + COLORS[i % COLORS.length] + ')';
      tr.appendChild(f); d.appendChild(l); d.appendChild(tr); box.appendChild(d);
    });
    return {c:c, tot:tot};
  }
  function showPublicResults(){
    var mine = load(K_VOTED, null);
    $('voteView').hidden = true; $('resultView').hidden = false;
    var r = drawBars($('pubBars'), mine);
    $('pubMeta').textContent = summary
      ? r.tot + ' votes so far · thanks for voting!'
      : 'Thanks for voting! Results are loading…';
  }

  // ---- voting ----
  var locked = false;
  function vote(i){
    if (locked) return;
    locked = true;
    queue.push({t: new Date().toISOString(), i: i, label: POLL.options[i], src: STAND ? 'stand' : 'online', dev: dev});
    save(K_QUEUE, queue);
    flush();
    if (STAND){
      $('pick').textContent = POLL.options[i];
      var th = $('thanks'), r = th.querySelector('.rocket');
      r.style.animation = 'none'; void r.offsetWidth; r.style.animation = '';
      th.hidden = false;
      setTimeout(function(){ th.hidden = true; locked = false; }, 2200);
    } else {
      save(K_VOTED, i);
      showPublicResults();
    }
  }

  // ---- sync with the shared counter (Abacus, no account needed) ----
  var sending = false, lastOk = null;
  function key(src, i){ return src + '-' + (i + 1); }
  function flush(){
    if (sending || !queue.length) return Promise.resolve();
    sending = true;
    var v = queue[0];
    return fetch(API + '/hit/' + POLL_ID + '/' + key(v.src, v.i), {cache:'no-store'})
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(){
        queue.shift(); save(K_QUEUE, queue); lastOk = new Date();
        sending = false;
        if (queue.length) return new Promise(function(res){ setTimeout(res, 400); }).then(flush);
        return fetchSummary();
      })
      .catch(function(){ sending = false; afterSync(); });
  }
  function getCount(k){
    return fetch(API + '/get/' + POLL_ID + '/' + k, {cache:'no-store'})
      .then(function(r){ if (r.status === 404) return {value:0}; if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(j){ return +j.value || 0; });
  }
  function fetchSummary(){
    var jobs = [];
    POLL.options.forEach(function(_, i){ jobs.push(getCount(key('stand', i)), getCount(key('online', i))); });
    return Promise.all(jobs).then(function(v){
      var s = {counts:{}, stand:0, online:0, total:0};
      POLL.options.forEach(function(_, i){
        var st = v[2*i], on = v[2*i+1];
        s.counts[i+1] = st + on; s.stand += st; s.online += on;
      });
      s.total = s.stand + s.online;
      // include this device's not-yet-uploaded votes so nobody sees their vote missing
      queue.forEach(function(q){ s.counts[q.i+1]++; s.total++; if (q.src === 'stand') s.stand++; else s.online++; });
      summary = s; lastOk = new Date();
    }).catch(function(){}).then(afterSync);
  }
  function afterSync(){
    if (!$('admin').hidden) drawAdmin();
    if (!STAND && load(K_VOTED, null) !== null) showPublicResults();
  }
  setInterval(function(){ queue.length ? flush() : null; }, 15000);
  addEventListener('online', flush);
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') flush(); });

  // ---- admin (5 taps on logo) ----
  var taps = [];
  $('logo').addEventListener('click', function(){
    var now = Date.now(); taps = taps.filter(function(x){ return now - x < 2500; }); taps.push(now);
    if (taps.length >= 5){ taps = []; $('admin').hidden = false; drawAdmin(); fetchSummary(); }
  });
  function drawAdmin(){
    var dot = $('dot'), st = $('statusTxt');
    if (queue.length){ dot.className = 'dot warn'; st.textContent = queue.length + ' vote' + (queue.length > 1 ? 's' : '') + ' waiting to upload (will retry automatically)'; }
    else if (lastOk){ dot.className = 'dot ok'; st.textContent = 'All votes uploaded · ' + lastOk.toLocaleTimeString(); }
    else { dot.className = 'dot'; st.textContent = 'Checking connection…'; }
    var r = drawBars($('bars'), null);
    $('total').textContent = summary ? r.tot : '–';
    $('split').textContent = summary ? '(' + summary.stand + ' stand · ' + summary.online + ' online)' : '';
    [].forEach.call($('bars').querySelectorAll('.bar'), function(el, i){ el.querySelector('b').textContent = r.c[i] + ' · ' + el.querySelector('b').textContent; });
  }
  $('refresh').addEventListener('click', function(){ fetchSummary().then(function(){ toast(lastOk ? 'Updated' : 'No connection right now'); }); });
  $('sync').addEventListener('click', function(){ if (!queue.length){ toast('Nothing pending'); return; } flush().then(function(){ toast(queue.length ? 'Still offline, will retry' : 'Uploaded ✓'); }); });
  $('close').addEventListener('click', function(){ $('admin').hidden = true; });
  $('copy').addEventListener('click', function(){
    var r = drawBars(document.createElement('div'), null);
    var txt = POLL.question + ' (' + r.tot + ' votes)\n' + POLL.options.map(function(o, i){ return o + ': ' + (r.tot ? Math.round(r.c[i]*100/r.tot) : 0) + '%'; }).join('\n');
    var done = function(){ toast('Summary copied'); }, fail = function(){ window.prompt('Copy the summary:', txt); };
    try{ navigator.clipboard.writeText(txt).then(done, fail); }catch(e){ fail(); }
  });
  $('fs').addEventListener('click', function(){
    var el = document.documentElement;
    try{ var p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if (p && p.catch) p.catch(function(){}); }catch(e){ toast('Use Guided Access on iPad / Add to Home Screen'); }
    $('admin').hidden = true;
  });

  function toast(m){ var t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(function(){ t.hidden = true; }, 1800); }

  // ---- kiosk niceties ----
  if (STAND){
    document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
    document.addEventListener('contextmenu', function(e){ if ($('admin').hidden) e.preventDefault(); });
    var wake = function(){ try{ if (navigator.wakeLock && document.visibilityState === 'visible') navigator.wakeLock.request('screen').catch(function(){}); }catch(e){} };
    document.addEventListener('visibilitychange', wake); document.addEventListener('click', wake); wake();
  }

  // ---- starfield ----
  var cv = $('stars'), cx = cv.getContext('2d'), stars = [];
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){ cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
    stars = Array.from({length: 140}, function(){ return {x:Math.random()*cv.width, y:Math.random()*cv.height, r:Math.random()*1.4*devicePixelRatio+.3, s:Math.random()*.25+.05}; }); }
  function tick(){ cx.clearRect(0,0,cv.width,cv.height); cx.fillStyle = '#fff';
    stars.forEach(function(p){ if (!still){ p.y -= p.s*devicePixelRatio; if (p.y < 0) p.y = cv.height; } cx.globalAlpha = .35 + p.r/4; cx.beginPath(); cx.arc(p.x,p.y,p.r,0,7); cx.fill(); });
    requestAnimationFrame(tick); }
  addEventListener('resize', size); size(); tick();

  // ---- start ----
  if (!STAND && load(K_VOTED, null) !== null) showPublicResults();
  if (queue.length) flush(); else fetchSummary();
})();
</script>
</body>
</html>
